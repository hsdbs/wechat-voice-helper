<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信语音发送助手</title>
  <style>
    :root {
      --primary: #07c160;
      --primary-hover: #06ad56;
      --primary-glow: rgba(7, 193, 96, 0.25);
      --danger: #fa5151;
      --warning: #fa9d3b;
      --warning-bg: #fffbe6;
      --warning-border: #ffe58f;
      --bg: #f7f8fa;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border: rgba(0, 0, 0, 0.08);
      --text: #191919;
      --text-sec: #7d7d7d;
      --text-muted: #b2b2b2;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card-bg: rgba(30, 30, 30, 0.85);
        --border: rgba(255, 255, 255, 0.1);
        --text: #f0f0f0;
        --text-sec: #9e9e9e;
        --text-muted: #666666;
        --warning-bg: #2b2111;
        --warning-border: #594214;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 顶部导航与设备状态卡片 */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .device-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .device-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: rgba(7, 193, 96, 0.12);
      color: var(--primary);
    }

    .badge-virtual {
      background: rgba(24, 144, 255, 0.12);
      color: #1890ff;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 0 rgba(7, 193, 96, 0.7);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(7, 193, 96, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(7, 193, 96, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(7, 193, 96, 0); }
    }

    .mic-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .mic-info {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .device-subtext {
      font-size: 12px;
      color: var(--text-sec);
      margin-top: 8px;
      line-height: 1.5;
    }

    .device-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    /* 拖拽上传区域 (Drop Zone) */
    .dropzone {
      border: 2px dashed rgba(7, 193, 96, 0.4);
      border-radius: var(--radius-lg);
      background: rgba(7, 193, 96, 0.03);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
    }

    .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(7, 193, 96, 0.08);
      transform: scale(1.015);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      fill: var(--primary);
      opacity: 0.85;
      transition: var(--transition);
    }

    .dropzone:hover .upload-icon {
      transform: translateY(-4px);
      opacity: 1;
    }

    .dropzone-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .dropzone-subtitle {
      font-size: 12px;
      color: var(--text-sec);
    }

    #fileInput {
      display: none;
    }

    /* 已选音频详情卡片 */
    .file-details {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .file-info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .file-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }

    .file-meta {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
      font-family: Consolas, monospace;
    }

    /* 超限 60 秒警示条 */
    .warning-banner {
      display: none;
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: #d46b08;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* 切片列表 */
    .split-list {
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .split-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      font-size: 13px;
    }

    .split-item:hover, .split-item.active {
      border-color: var(--primary);
      background: rgba(7, 193, 96, 0.08);
      color: var(--primary);
      font-weight: 600;
    }

    /* 控制面板与倒计时大显示器 */
    .action-card {
      text-align: center;
      padding: 24px 20px;
    }

    .display-screen {
      background: rgba(0, 0, 0, 0.03);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
    }

    .countdown-number {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      color: #fa8c16;
      animation: pop 0.4s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      80% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }

    .status-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* 进度条 */
    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      overflow: hidden;
      margin: 12px 0 6px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 4px;
      transition: width 0.1s linear;
    }

    .time-label {
      font-family: Consolas, monospace;
      font-size: 12px;
      color: var(--text-sec);
    }

    /* 按钮组 */
    .btn-row {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      outline: none;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      flex: 1;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .btn-danger {
      background: rgba(250, 81, 81, 0.1);
      color: var(--danger);
      padding: 12px 18px;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* 音频波形动画条 */
    .wave-bars {
      display: none;
      align-items: center;
      gap: 3px;
      height: 24px;
      margin-top: 4px;
    }

    .wave-bar {
      width: 4px;
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      animation: wave 0.8s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bar:nth-child(5) { animation-delay: 0.6s; }

    @keyframes wave {
      0% { height: 4px; }
      100% { height: 22px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. 声卡与麦克风状态卡片 -->
    <section class="card">
      <div class="device-header">
        <span class="device-title">Windows 声音通道接管监控</span>
        <span class="badge badge-success">
          <span class="pulse-dot"></span>
          虚拟通道已激活
        </span>
      </div>

      <div class="mic-status-row">
        <span class="mic-info" id="currentMicLabel">当前默认麦克风: 检测中...</span>
      </div>

      <p class="device-subtext">
        🔊 <b>投放目标</b>: 微信专用 (虚拟声卡)<br>
        🎙️ <b>录音通道</b>: 微信专用 (虚拟麦克风)（点击播放瞬间毫秒级自动切入，播完自动切回原麦克风）
      </p>

      <div class="device-actions">
        <button class="btn btn-secondary" onclick="restoreMic()">🔄 恢复日常物理麦克风</button>
        <button class="btn btn-secondary" onclick="switchVirtualMic()">🎙️ 测试切到虚拟麦克风</button>
        <button class="btn btn-secondary" onclick="openSoundCpl()">⚙️ 声音控制面板</button>
      </div>
    </section>

    <!-- 2. 音频选择与拖拽区 -->
    <section class="card">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <svg class="upload-icon" viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <div class="dropzone-title">拖拽音频文件到这里，或点击选择</div>
        <div class="dropzone-subtitle">支持 MP3, WAV, M4A, FLAC, AAC, OGG 等所有常见格式 (秒级极速解析)</div>
        <input type="file" id="fileInput" accept="audio/*">
      </div>

      <!-- 文件详情与切片 -->
      <div class="file-details" id="fileDetails" style="margin-top: 14px;">
        <div class="file-info-header">
          <span class="file-name" id="fileNameLabel">未选择</span>
          <span class="file-meta" id="fileDurLabel">00:00</span>
        </div>

        <div class="warning-banner" id="warningBanner">
          <span id="warningText">⚠️ 该音频超过微信 60 秒上限</span>
          <button class="btn btn-secondary" onclick="splitAudio()" id="btnSplit">✂️ 一键智能切分为 55 秒片段</button>
        </div>

        <div class="split-list" id="splitList"></div>
      </div>
    </section>

    <!-- 3. 发送控制卡片 -->
    <section class="card action-card">
      <div class="display-screen" id="displayScreen">
        <div class="countdown-number" id="countdownNum" style="display: none;">3</div>
        <div class="status-text" id="statusMessage">请先拖入或选择音频文件</div>
        <div class="wave-bars" id="waveBars">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <div class="progress-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-label" id="timeLabel">00:00 / 00:00</div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="btnPlay" onclick="startPlay()" disabled>
          ▶️ 开始发送 (自动切声卡+倒计时)
        </button>
        <button class="btn btn-danger" id="btnStop" onclick="stopPlay()" disabled>
          ⏹️ 停止
        </button>
      </div>
    </section>

    <!-- 底部工具栏 -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; font-size: 12px; color: var(--text-muted);">
      <span>微信语音发送助手 · 极速 Web 架构</span>
      <button onclick="shutdownApp()" style="background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text-sec); cursor: pointer; transition: var(--transition);">
        ❌ 退出并关闭助手
      </button>
    </div>

  </div>

  <script>
    let pollTimer = null;
    let currentDuration = 0;
    let isSplitAvailable = false;

    // 1. 初始化拖拽事件 (Drag & Drop)
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    ['dragenter', 'dragover'].forEach(name => {
      window.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      window.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFileSelection(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelection(e.target.files[0]);
      }
    });

    // 2. 毫秒级极速解析与上传 (完全消除卡顿！)
    function handleFileSelection(file) {
      document.getElementById('fileDetails').style.display = 'flex';
      document.getElementById('fileNameLabel').textContent = file.name;
      document.getElementById('fileDurLabel').textContent = "正在读取...";
      document.getElementById('warningBanner').style.display = 'none';
      document.getElementById('splitList').style.display = 'none';
      document.getElementById('btnPlay').disabled = true;

      // 利用现代浏览器原生 Audio API，5毫秒内瞬时读取时长！不阻塞任何进程！
      const tempAudio = new Audio();
      const objUrl = URL.createObjectURL(file);
      tempAudio.src = objUrl;

      tempAudio.addEventListener('loadedmetadata', () => {
        const dur = tempAudio.duration;
        currentDuration = dur;
        const mins = Math.floor(dur / 60);
        const secs = Math.floor(dur % 60);
        const durStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        document.getElementById('fileDurLabel').textContent = `时长: ${durStr} (${dur.toFixed(1)}s)`;
        document.getElementById('timeLabel').textContent = `00:00 / ${durStr}`;

        if (dur > 60) {
          document.getElementById('warningBanner').style.display = 'flex';
          document.getElementById('warningText').textContent = `⚠️ 该音频时长 ${dur.toFixed(1)} 秒，超过微信 60 秒上限！`;
          document.getElementById('statusMessage').textContent = "⚠️ 音频超过 60 秒！建议点击上方【智能切分】";
          document.getElementById('statusMessage').style.color = "#fa8c16";
        } else {
          document.getElementById('warningBanner').style.display = 'none';
          document.getElementById('statusMessage').textContent = "准备就绪！点击【开始发送】自动切声卡并投放";
          document.getElementById('statusMessage').style.color = "var(--primary)";
        }
        document.getElementById('btnPlay').disabled = false;
        URL.revokeObjectURL(objUrl);
      });

      tempAudio.addEventListener('error', () => {
        console.warn("浏览器原生无法直接解析该编码，等待后端 ffmpeg 解析...");
        URL.revokeObjectURL(objUrl);
      });

      // 后台异步二进制上传到本地 Python 服务器
      fetch(`/api/upload?filename=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        body: file
      })
      .then(res => res.json())
      .then(data => {
        if (data.duration) {
          const dur = data.duration;
          currentDuration = dur;
          const mins = Math.floor(dur / 60);
          const secs = Math.floor(dur % 60);
          const durStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          document.getElementById('fileDurLabel').textContent = `时长: ${durStr} (${dur.toFixed(1)}s)`;
          document.getElementById('timeLabel').textContent = `00:00 / ${durStr}`;

          if (dur > 60) {
            document.getElementById('warningBanner').style.display = 'flex';
            document.getElementById('warningText').textContent = `⚠️ 该音频时长 ${dur.toFixed(1)} 秒，超过微信 60 秒上限！`;
            document.getElementById('statusMessage').textContent = "⚠️ 音频超过 60 秒！建议点击上方【智能切分】";
            document.getElementById('statusMessage').style.color = "#fa8c16";
          } else {
            document.getElementById('warningBanner').style.display = 'none';
            document.getElementById('statusMessage').textContent = "准备就绪！点击【开始发送】自动切声卡并投放";
            document.getElementById('statusMessage').style.color = "var(--primary)";
          }
          document.getElementById('btnPlay').disabled = false;
        }
      })
      .catch(err => console.error("Upload error:", err));
    }

    // 3. 一键智能切分为 55 秒片段
    function splitAudio() {
      const btnSplit = document.getElementById('btnSplit');
      btnSplit.disabled = true;
      btnSplit.textContent = "正在切分中...";

      fetch('/api/split', { method: 'POST' })
      .then(res => res.json())
      .then(data => {
        btnSplit.disabled = false;
        btnSplit.textContent = "✂️ 重新切分";
        if (data.parts && data.parts.length > 0) {
          renderSplitList(data.parts);
        }
      })
      .catch(err => {
        btnSplit.disabled = false;
        btnSplit.textContent = "✂️ 一键智能切分";
        alert("切分出错: " + err);
      });
    }

    function renderSplitList(parts) {
      const splitList = document.getElementById('splitList');
      splitList.innerHTML = '';
      splitList.style.display = 'flex';

      parts.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = 'split-item' + (idx === 0 ? ' active' : '');
        item.innerHTML = `
          <span><b>第 ${idx + 1} 段</b> (${p.duration.toFixed(1)}s)</span>
          <span style="font-size: 12px; color: var(--text-sec);">${idx === 0 ? '当前待发' : '点击选择'}</span>
        `;
        item.onclick = () => selectPart(idx);
        splitList.appendChild(item);
      });

      selectPart(0);
    }

    function selectPart(idx) {
      fetch('/api/select_part', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idx })
      })
      .then(res => res.json())
      .then(data => {
        const items = document.querySelectorAll('.split-item');
        items.forEach((el, i) => {
          el.classList.toggle('active', i === idx);
          el.querySelector('span:last-child').textContent = (i === idx ? '当前待发' : '点击选择');
        });
        currentDuration = data.part.duration;
        const mins = Math.floor(currentDuration / 60);
        const secs = Math.floor(currentDuration % 60);
        document.getElementById('timeLabel').textContent = `00:00 / ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        document.getElementById('statusMessage').textContent = `已选片段：第 ${idx + 1} 段！点击【开始发送】`;
        document.getElementById('statusMessage').style.color = "var(--primary)";
      });
    }

    // 4. 发送与播放控制
    function startPlay() {
      fetch('/api/play', { method: 'POST' })
      .then(res => res.json())
      .then(() => {
        document.getElementById('btnPlay').disabled = true;
        document.getElementById('btnStop').disabled = false;
      });
    }

    function stopPlay() {
      fetch('/api/stop', { method: 'POST' })
      .then(res => res.json())
      .then(() => {
        document.getElementById('btnPlay').disabled = false;
        document.getElementById('btnStop').disabled = true;
      });
    }

    function restoreMic() {
      fetch('/api/restore_mic', { method: 'POST' })
      .then(() => alert("已恢复日常物理麦克风！"));
    }

    function switchVirtualMic() {
      fetch('/api/switch_virtual_mic', { method: 'POST' })
      .then(() => alert("已切换至微信专用虚拟麦克风！"));
    }

    function openSoundCpl() {
      fetch('/api/open_sound_cpl', { method: 'POST' });
    }

    function shutdownApp() {
      if (confirm("确定要退出并关闭微信语音发送助手吗？\n退出时将自动为您恢复原有日常麦克风。")) {
        fetch('/api/shutdown', { method: 'POST' }).finally(() => {
          window.close();
        });
      }
    }

    // 5. 实时状态轮询 (State Polling)
    function pollStatus() {
      fetch('/api/status')
      .then(res => res.json())
      .then(st => {
        // 更新麦克风标签
        const micLabel = document.getElementById('currentMicLabel');
        if (st.is_virtual_mic_active) {
          micLabel.innerHTML = `当前默认麦克风: <span style="color: var(--primary);">[虚拟麦克风已接管] ${st.current_mic_name}</span>`;
        } else {
          micLabel.innerHTML = `当前默认麦克风: <span style="color: #1890ff;">[日常物理设备] ${st.current_mic_name}</span>`;
        }

        // 状态信息
        const statusMsg = document.getElementById('statusMessage');
        const countdownNum = document.getElementById('countdownNum');
        const waveBars = document.getElementById('waveBars');
        const progressBar = document.getElementById('progressBar');
        const timeLabel = document.getElementById('timeLabel');
        const btnPlay = document.getElementById('btnPlay');
        const btnStop = document.getElementById('btnStop');

        if (st.state === 'countdown') {
          countdownNum.style.display = 'block';
          countdownNum.textContent = st.countdown;
          waveBars.style.display = 'none';
          statusMsg.textContent = st.status_message;
          statusMsg.style.color = "#fa8c16";
          btnPlay.disabled = true;
          btnStop.disabled = false;
        } else if (st.state === 'playing') {
          countdownNum.style.display = 'none';
          waveBars.style.display = 'flex';
          statusMsg.textContent = st.status_message;
          statusMsg.style.color = "var(--primary)";
          progressBar.style.width = st.progress_pct + '%';

          const elM = Math.floor(st.elapsed / 60);
          const elS = Math.floor(st.elapsed % 60);
          const totM = Math.floor(st.duration / 60);
          const totS = Math.floor(st.duration % 60);
          timeLabel.textContent = `${String(elM).padStart(2, '0')}:${String(elS).padStart(2, '0')} / ${String(totM).padStart(2, '0')}:${String(totS).padStart(2, '0')}`;
          btnPlay.disabled = true;
          btnStop.disabled = false;
        } else if (st.state === 'completed') {
          countdownNum.style.display = 'none';
          waveBars.style.display = 'none';
          statusMsg.textContent = st.status_message;
          statusMsg.style.color = "var(--primary)";
          progressBar.style.width = '100%';
          btnPlay.disabled = false;
          btnStop.disabled = true;
        } else {
          countdownNum.style.display = 'none';
          waveBars.style.display = 'none';
          if (!st.is_playing) {
            btnStop.disabled = true;
            if (st.current_file) {
              btnPlay.disabled = false;
            }
          }
        }
      })
      .catch(err => {})
      .finally(() => {
        setTimeout(pollStatus, 200);
      });
    }

    // 启动轮询
    pollStatus();
  </script>
</body>
</html>
